nested_rights:
  status: field_level_exclusions_required
  findings:
    - Brief, short, and article descriptions are documented as generated with Claude 3 AI.
    - Display-name variants are based partly on ESV, KJV, and NIV forms and retain translation provenance.
    - Relationship assertions include explicit ambiguity markers that must never be flattened into certainty.
  excluded_assets:
    - AI-generated descriptions
    - translation-specific prose and name-difference fields
    - unqualified relationship assertions

v1_policy:
  ordinary_answer_eligible: true
  study_mode_eligible: true
  input_file: Proper Nouns/TIPNR - Translators Individualised Proper Names with all References - STEPBible.org CC BY.txt
  record_grammar:
    record_start: A line beginning with `$==========` starts a structural record.
    documentation_records: The three no-space marker records at source ordinals 1–3 are source documentation and are never entity-eligible.
    entity_markers: Spaced PERSON(s) and PLACE markers may be eligible; OTHER, EXCLUDED OTHER, and PERSON+PLACE receive explicit non-eligible outcomes.
    primary_row: The first tab-separated row after an entity marker; approved person rows have nine meaningful columns and approved place rows have eight.
    form_row: A later tab-separated row whose first column is a significance marker; rows marked `Total` are excluded.
    generated_prose: Lines beginning `@Briefest=`, `@Brief=`, `@Short=`, `@Article=`, or `@Ambiguity=` are excluded without retaining their values.
  allowed_raw_fields:
    - raw_path: entity marker `$========== {PERSON(s)|PLACE|OTHER}`
      output_field: entity_type
      transform: closed mapping PERSON(s)->person, PLACE->place, OTHER->other; reject every other marker
      provenance: TIPNR structural record marker
    - raw_path: primary row column 1 `UnifiedName=uStrong`, substring after final `=`
      output_field: entity_id
      transform: retain only the source uStrong token; discard the translated-name and reference prefix
      provenance: TIPNR uStrong identifier
    - raw_path: non-Total form row column 3 `dStrong«eStrong=Heb/Grk`
      output_field: original_language
      transform: split exactly into dstrong, estrong, and source_script_form; reject a row that does not parse all three components
      provenance: TIPNR disambiguated/electronic Strong identifiers and Hebrew/Greek form
    - raw_path: non-Total form row column 5 `All Refs`
      output_field: osis_references
      transform: split source reference list; preserve subverse suffixes; reject abbreviations such as `ff` rather than expanding them
      provenance: TIPNR exhaustive occurrence field
  allowed_output_fields:
    - entity_type
    - entity_id
    - original_language.dstrong
    - original_language.estrong
    - original_language.source_script_form
    - osis_references
  excluded_fields:
    - brief description
    - short description
    - article description
    - ESV/KJV/NIV comparison prose
    - family and other relationships
    - inferred doctrinal synthesis
  uncertainty_rule: Preserve source ambiguity markers if any relationship field is considered in a later policy revision.
  unknown_field_policy: reject
  rationale: The allowlist is limited to structured identifiers, forms, and references that do not require a model to judge doctrinal prose.

proposed_registration:
  model: per_dataset
  license_status: licensed
  visibility: hidden
  source_rows:
