decision:
  status: approved
  approved_by: Alex Whitley
  approved_at: "2026-09-01"
  disposition: Approve the geocoding-only V1 boundary and future hidden per-dataset registration proposal; cross references remain prohibited and no registration or ingestion is authorized now.
  recommendation: Approve the conservative geocoding allowlist for a hidden proof; keep cross references un-ingested and answer-ineligible.
